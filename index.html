<body></body>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>
  nn.get('body')
    .css('background', 'purple')
    .css('margin', 0)
    .css('width', '100vw')
    .css('height', '100vh')
    //.css('overflow', 'hidden')

  let portalNum = 1;
  const title = nn.create('div').addTo('body')
    .content('PATATAP GAMER EDITON')
    .css('font-family', 'cursive')
    .css('font-size', '20px')
    .css('position', 'absolute')
    .css('top', '300px')
    .css('left', '200px')
    .css('z-index', 3)
  const pick = nn.create('img').addTo('body')
    .set('src', 'pick.png')
    .css('position', 'absolute')
    .css('top', '50%')
    .css('left', '50%')
    .css('z-index', 2)
    .css('opacity', 0)
  const theory = nn.create('img').addTo('body')
    .set('src', 'game.png')
    .css('position', 'absolute')
    .css('top', '50%')
    .css('left', '50%')
    .css('z-index', 2)
    .css('opacity', 0)
  const portalBlue = nn.create('img').addTo('body')
    .set('src', 'portalblue.png')
    .css('position', 'absolute')
    .css('top', '50%')
    .css('left', '50%')
    .css('z-index', 2)
    .css('opacity', 0)
  const portalOrange = nn.create('img').addTo('body')
    .set('src', 'portalorange.png')
    .css('position', 'absolute')
    .css('top', '50%')
    .css('left', '50%')
    .css('z-index', 2)
    .css('opacity', 0)
  const marioCoin = nn.create('img').addTo('body')
    .set('src', 'coin.png')
    .css('position', 'absolute')
    .css('top', '0%')
    .css('left', '0%')
    .css('opacity', 0)
    .css('z-index', 2)
  const keys = nn.create('img').addTo('body')
    .set('src', 'keys.png')
    .css('position', 'absolute')
    .css('top', '50%')
    .css('left', '0%')
    .css('z-index', 1)

  const coin = nn.create('audio')
    .set('src', 'coin.mp3')
    .set('preload', 'auto')
    .set('controls', true)
  const creeper = nn.create('audio')
    .set('src', 'creeper.mp3')
    .set('preload', 'auto')
    .set('controls', true)
  const mark = nn.create('audio')
    .set('src', 'mark.mp3')
    .set('preload', 'auto')
    .set('controls', true)
  const bite = nn.create('audio')
    .set('src', 'BITE.mp3')
    .set('preload', 'auto')
    .set('controls', true)
  const game = nn.create('audio')
    .set('src', 'game.mp3')
    .set('preload', 'auto')
    .set('controls', true)
  const portal = nn.create('audio')
    .set('src', 'portal.mp3')
    .set('preload', 'auto')
    .set('controls', true)



  function portalFunc () {
    const y = nn.random(0, 50)
    const x = nn.random(0, 80)
    if (portalNum === 1) {
      portalBlue.css('top', y + '%')
      portalBlue.css('left', x + '%')
      const timing = {
        duration: 600,
        easing: 'ease-out'
      }
      const keyframes = [{
          opacity: 0
        },
        {
          opacity: 1
        },
        {
          opacity: 0
        }
      ]
      const anim = portalBlue.animate(keyframes, timing)
    }
    if (portalNum === -1) {
      portalOrange.css('top', y + '%')
      portalOrange.css('left', x + '%')
      const timing = {
        duration: 600,
        easing: 'ease-out'
      }
      const keyframes = [{
          opacity: 0
        },
        {
          opacity: 1
        },
        {
          opacity: 0
        }
      ]
      const anim = portalOrange.animate(keyframes, timing)
    }
    portalNum *= -1;
  }

  function swipe () {
    const y = nn.random(0, 80)
    pick.css('top', y + '%')
    const timing = {
      duration: 3000,
      easing: 'ease-out'
    }
    const keyframes = [{
        opacity: 0,
        transform: 'translateX(0px)'
      },
      {
        opacity: 1,
        transform: 'translateX(-300px)'
      },
      {
        opacity: 1,
        transform: 'translateX(200px)'
      },
      {
        opacity: 1,
        transform: 'translateX(-300px)'
      },
      {
        opacity: 1,
        transform: 'translateX(200px)'
      }
    ]
    const anim = pick.animate(keyframes, timing)
  }

  function roll () {
    const y = nn.random(0, 50)
    const x = nn.random(0, 50)
    theory.css('top', y + '%')
    theory.css('left', x + '%')
    const timing = {
      duration: 1500,
      easing: 'ease-out'
    }
    const keyframes = [{
        opacity: 0,
        transform: 'rotate(0deg)'
      },
      {
        opacity: 1,
        transform: 'rotate(180deg)'
      },
      {
        opacity: 1,
        transform: 'rotate(360deg)'
      }
    ]
    const anim = theory.animate(keyframes, timing)
  }
  
  function coinPunch(){
    const timing = {
      duration: 600,
      easing: 'ease-out'
    }
    const keyframes = [{
        opacity: 0,
        transform: 'translateY(0px)'
      },
      {
        opacity: 1,
        transform: 'translateY(-300px)'
      },
      {
        opacity: 1,
        transform: 'translateY(200px)'
      },
    ]
    const anim = marioCoin.animate(keyframes, timing)
  }

  function playSound (e) {
    if (e.key === 'y') {
      coin.currentTime = 0
      coin.play()
      coinPunch()
    } else if (e.key === 'h') {
      creeper.currentTime = 0
      creeper.play()
      swipe()
    } else if (e.key === 'n') {
      mark.currentTime = 0
      mark.play()
    } else if (e.key === 'm') {
      bite.currentTime = 0
      bite.play()
    } else if (e.key === 'j') {
      game.currentTime = 0
      game.play()
      roll()
    } else if (e.key === 'u') {
      portal.currentTime = 0
      portal.play()
      portalFunc()
    }

  }

  nn.on('keydown', playSound)
</script>
